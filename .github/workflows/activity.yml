name: Update System Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * 1"

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate activity matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Furruka
        run: |
          python3 .github/scripts/activity.py

      - name: Commit activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg
          git diff --cached --quiet || git commit -m "chore: update activity telemetry"
          git push
