name: Update Developer Log

on:
  workflow_dispatch:
  schedule:
    - cron: "27 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  developer-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python3 -m pip install requests

      - name: Generate Developer Log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Furruka
        run: |
          python3 .github/scripts/developer_log.py

      - name: Generate Currently Building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Furruka
        run: |
          python3 .github/scripts/currently_building.py

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/developer-log.svg profile/currently-building.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update developer profile"

          git pull --rebase origin main

          git push origin HEAD:main
